[project]
name = "cg-app"
version = "0.1.0"
description = "A Curiosity Games internal app — bootstrapped from cg-app-template."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # Local preview uses SQLite instead of Postgres — needs the async driver.
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"
