  function redrawList(){
    var host=document.getElementById("adm-list");
    if(host) drawList(host);
  }

  function visibleRows(){
    var q=state.admin.q.trim().toLowerCase();
    var rows=state.admin.rows.filter(function(r){
      if(state.admin.store && (r.location||"")!==state.admin.store) return false;
      if(state.admin.status){
        var st = r.status==="loaded" ? "loaded" : "new";
        if(st!==state.admin.status) return false;
      }
      if(!q) return true;
      return [r.name,r.email,r.group,r.location].some(function(v){
        return String(v||"").toLowerCase().indexOf(q)>-1;
      });
    });
    var s=state.admin.sort;
    rows.sort(function(a,b){
      if(s==="submitted-asc") return String(a.submittedAt||"").localeCompare(String(b.submittedAt||""));
      if(s==="event-asc") return String(a.eventDate||"9999").localeCompare(String(b.eventDate||"9999"));
      if(s==="event-desc") return String(b.eventDate||"").localeCompare(String(a.eventDate||""));
      if(s==="store-asc"){
        var c=String(a.location||"zzz").localeCompare(String(b.location||"zzz"));
        return c || String(b.submittedAt||"").localeCompare(String(a.submittedAt||""));
      }
      if(s==="name-asc") return String(a.name||"").localeCompare(String(b.name||""));
      return String(b.submittedAt||"").localeCompare(String(a.submittedAt||""));
    });
    return rows;
  }

  function setChippy(row,on){
    api("PATCH","/api/review/submissions/"+row.id,{status:on?"loaded":"new"})
      .then(function(){
        row.status=on?"loaded":"new";
        redrawList();
        if(state.admin.open && state.admin.open.id===row.id) render();
      }).catch(function(e){
        toast(e.status===403 ? "You have read-only access to this app"
                             : "Couldn't update ("+(e.message||"error")+")");
      });
  }

  function deleteSubmission(row,after){
    api("DELETE","/api/review/submissions/"+row.id).then(function(){
      state.admin.rows=state.admin.rows.filter(function(r){ return r.id!==row.id; });
      if(state.admin.open && state.admin.open.id===row.id) state.admin.open=null;
      toast("Submission deleted");
      if(after) after(); else render();
    }).catch(function(e){
      toast(e.status===403 ? "Only an admin can delete a submission"
                           : "Couldn't delete ("+(e.message||"error")+")");
    });
  }

  /* Two-click delete: no browser dialog, no accidental loss. */
  function armDelete(btn,onConfirm,label){
    if(btn.dataset.armed==="1"){ onConfirm(); return; }
    btn.dataset.armed="1";
    btn.classList.add("danger");
    var was=btn.textContent;
    btn.textContent=label||"Confirm delete";
    setTimeout(function(){
      if(!btn.isConnected) return;
      btn.dataset.armed="0"; btn.classList.remove("danger"); btn.textContent=was;
    },4000);
  }

  function drawList(host){
    clear(host);
    if(state.admin.loading){ host.appendChild(el("p","empty","Loading…")); return; }
    if(state.admin.error){ host.appendChild(el("div","notice",state.admin.error)); return; }
    if(!state.admin.rows.length){ host.appendChild(el("p","empty","No submissions yet.")); return; }

    var rows=visibleRows();
    var count=el("p","hint",rows.length+" of "+state.admin.rows.length+" submission"+
      (state.admin.rows.length===1?"":"s")+" · updating live");
    count.style.marginBottom="12px";
    host.appendChild(count);

    if(!rows.length){ host.appendChild(el("p","empty","Nothing matches those filters.")); return; }

    rows.forEach(function(row){
      var loaded = row.status==="loaded";
      var r=el("div","subrow"+(loaded?" is-loaded":""));

      var box=el("button","chk"+(loaded?" on":"")); box.type="button";
      box.title=loaded?"Uploaded to Chippy — click to unmark":"Mark as uploaded to Chippy";
      box.setAttribute("aria-pressed",loaded?"true":"false");
      box.setAttribute("aria-label","Uploaded to Chippy");
      box.textContent=loaded?"✓":"";
      box.addEventListener("click",function(){ setChippy(row,!loaded); });
      r.appendChild(box);

      var open=el("button","subopen"); open.type="button";
      open.appendChild(el("div","who",(row.name||"Unnamed")+(row.group?" · "+row.group:"")));
      var games=(row.games||[]).map(function(gid){ var g=gameById(gid); return g?g.name:gid; }).join(", ");
      open.appendChild(el("div","sub",
        (row.location||"No store")+" · "+(row.eventDate?formatDate(row.eventDate):"No date")+
        " · "+(games||"No games")));
      open.addEventListener("click",function(){
        state.admin.open=row;
        state.admin.checks=[]; state.admin.reviewState="idle"; state.admin.reviewMsg="";
        state.admin.editDraft=null;
        render(); window.scrollTo(0,0);
      });
      r.appendChild(open);

      var side=el("div","subside");
      side.appendChild(el("span","pill "+(loaded?"loaded":"new"), loaded?"In Chippy":"Not uploaded"));
      var del=el("button","mini","Delete"); del.type="button";
      del.addEventListener("click",function(){
        armDelete(del,function(){ deleteSubmission(row,redrawList); });
      });
      side.appendChild(del);
      r.appendChild(side);

      host.appendChild(r);
    });
  }


  /* ---------- per-field copy + review, producer side only ---------- */
  function adminPairs(g,rows,i){
    // Exactly the columns that go into the database, minus anything hidden.
    var vals=g.exportRow(rows[i]||{},i);
    if(!vals) return null;
    var out=[];
    for(var c=0;c<g.columns.length;c++){
      if(g.hideInAdmin && g.hideInAdmin.indexOf(g.columns[c])>-1) continue;
      out.push({label:g.columns[c],value:vals[c]||""});
    }
    return out;
  }

  /* One question rendered as a question and its answers, not a table row.
     `copyable` turns every value into a click-to-copy control. */
  function readableCard(g,rows,i,copyable,tone){
    var r=rows[i]||{};
    var lines=g.linesFor ? g.linesFor(r,i) : null;
    if(!lines) return null;

    var card=el("div","reccard"+(tone?" "+tone:""));
    var hd=el("div","rechead");
    hd.appendChild(el("span","recname",g.rowLabel(i)));
    card.appendChild(hd);

    function val(line){
      if(copyable) return copyValue(line.label,line.value);
      var s=el("div","plainval",line.value||"—");
      if(!line.value) s.classList.add("blank");
      return s;
    }

    lines.forEach(function(line){
      if(line.kind==="title"){
        var t=el("div","rtitle");
        t.appendChild(el("span","rlabel",line.label));
        t.appendChild(val(line));
        card.appendChild(t);
        return;
      }
      if(line.kind==="q"){
        var q=el("div","rq");
        q.appendChild(el("span","rlabel",line.label));
        q.appendChild(val(line));
        card.appendChild(q);
        return;
      }
      if(line.kind==="band"){
        card.appendChild(el("div","rband",line.value));
        return;
      }
      if(line.kind==="a"){
        var badge=line.badge||"A";
        var a=el("div","ra");
        a.appendChild(el("span","rbadge "+(badge==="Q"?"qq":"ans"),badge));
        a.appendChild(val(line));
        card.appendChild(a);
        return;
      }
      var o=el("div","ropt"+(line.correct?" right":""));
      o.appendChild(el("span","rbadge"+(line.correct?" right":""),line.letter));
      o.appendChild(val(line));
      if(line.correct) o.appendChild(el("span","rtag","Correct"));
      card.appendChild(o);
    });
    return card;
  }

  /* All of a game's questions, grouped into colored point rooms where the
     game has them, so the producer view reads like the input side. */
  function gameBody(g,rows,copyable){
    var host=document.createDocumentFragment();
    if(g.groups){
      g.groups.forEach(function(grp){
        var room=el("div","level "+grp.tone+" open flat");
        var hd=el("div","levelhead static");
        hd.appendChild(el("span","lvname",groupLabel(g,grp,rows)));
        room.appendChild(hd);
        var body=el("div","levelbody");
        grp.indices.forEach(function(ix){
          var c=readableCard(g,rows,ix,copyable,grp.tone);
          if(c) body.appendChild(c);
        });
        room.appendChild(body);
        host.appendChild(room);
      });
      return host;
    }
    for(var i=0;i<g.count;i++){
      var c=readableCard(g,rows,i,copyable,g.toneFor?g.toneFor(i):null);
      if(c) host.appendChild(c);
    }
    return host;
  }

  function copyValue(label,value){
    var b=el("button","copyval");
    b.type="button";
    b.title="Click to copy";
    b.appendChild(el("span","copyval-text",value||"—"));
    b.appendChild(el("span","copyval-ico","⧉"));
    if(!value) b.classList.add("blank");
    b.addEventListener("click",function(){ copyText(value,label+" copied"); });
    return b;
  }

  function fieldLine(label,value){
    var line=el("div","fieldline");
    line.appendChild(el("span","fl-label",label));
    line.appendChild(copyValue(label,value));
    return line;
  }

  function reviewItems(row){
    var out=[];
    (row.games||[]).forEach(function(gid){
      var g=gameById(gid); if(!g) return;
      var rows=(row.content||{})[gid]||[];
      for(var i=0;i<g.count;i++){
        var fields=g.fields(i), r=rows[i]||{};
        for(var j=0;j<fields.length;j++){
          var fd=fields[j];
          if(fd.type==="choice") continue;
          var v=(r[fd.key]||"").trim();
          if(!v) continue;
          out.push({id:gid+"|"+i+"|"+fd.key,
                    where:g.name+" — "+g.rowLabel(i)+" — "+fd.label,
                    limit:fd.limit,text:r[fd.key]});
        }
      }
    });
    return out;
  }

  function runAdminReview(row){
    var items=reviewItems(row);
    if(!items.length){
      state.admin.reviewState="done"; state.admin.checks=[];
      state.admin.reviewMsg="Nothing to check."; render(); return;
    }
    state.admin.reviewState="running"; state.admin.checks=[]; state.admin.reviewMsg="";
    render();

    /* The prompt and the API key live on the server; this only sends the
       text of the submission already on screen. */
    api("POST","/api/review/spellcheck",{
      items: items.map(function(it){ return {id:it.id,limit:it.limit,text:it.text}; })
    }).then(function(res){
      var byId={}; items.forEach(function(it){ byId[it.id]=it; });
      var found=[];
      (res.suggestions||[]).forEach(function(r){
        var it=byId[r.id]; if(!it) return;
        if(String(r.corrected).trim()===String(it.text).trim()) return;
        found.push({id:r.id,where:it.where,was:it.text,now:r.corrected,
                    why:String(r.reason||"Spelling and grammar.")});
      });
      state.admin.checks=found;
      state.admin.reviewState="done";
      state.admin.reviewMsg=found.length?"":"Clean sweep \u2014 nothing to fix.";
      render();
    }).catch(function(e){
      state.admin.reviewState="error";
      state.admin.reviewMsg = e.status===503
        ? "The proofreading service isn't set up on this app yet."
        : e.status===403 ? "You have read-only access to this app."
        : "The review couldn't finish ("+(e.message||"error")+"). Nothing was changed.";
      render();
    });
  }

  function applyAdminFix(row,c){
    var parts=c.id.split("|"), gid=parts[0], ri=+parts[1], key=parts[2];
    var content=JSON.parse(JSON.stringify(row.content||{}));
    if(!content[gid]) return;
    if(!content[gid][ri]) content[gid][ri]={};
    var was=content[gid][ri][key];
    content[gid][ri][key]=c.now;
    // Keep the stored correct answer pointing at the option it named.
    if(content[gid][ri].correct && content[gid][ri].correct===was) content[gid][ri].correct=c.now;
    api("PATCH","/api/review/submissions/"+row.id,{content:content}).then(function(res){
      if(res.submission) row.content=res.submission.content;
      state.admin.checks=state.admin.checks.filter(function(x){ return x.id!==c.id; });
      toast("Fix saved");
      render();
    }).catch(function(e){
      toast(e.status===403 ? "You have read-only access to this app"
                           : "Couldn't save ("+(e.message||"error")+")");
    });
  }

  function adminDetail(row){
    var frag=document.createDocumentFragment();

    var p=el("section","panel");
    var h=el("div","section-head");
    h.appendChild(el("h2","",row.name||"Unnamed submission"));
    h.appendChild(el("p","",(row.email||"no email")+(row.group?" · "+row.group:"")+
      " · "+(row.eventDate?formatDate(row.eventDate):"no date")+
      (row.location?" · "+row.location:"")));
    p.appendChild(h);

    var acts=el("div","acts");
    var back=el("button","mini","← All submissions"); back.type="button";
    back.addEventListener("click",function(){
      state.admin.open=null; state.admin.checks=[]; state.admin.reviewState="idle"; state.admin.reviewMsg="";
      state.admin.editDraft=null;
      render(); window.scrollTo(0,0);
    });
    acts.appendChild(back);

    var loaded = row.status==="loaded";
    var mark=el("button","mini chiptoggle"+(loaded?" on":"")); mark.type="button";
    mark.setAttribute("aria-pressed",loaded?"true":"false");
    mark.appendChild(el("span","chk small"+(loaded?" on":""),loaded?"✓":""));
    mark.appendChild(el("span",null,loaded?"Uploaded to Chippy":"Mark as uploaded to Chippy"));
    mark.addEventListener("click",function(){ setChippy(row,!loaded); });
    acts.appendChild(mark);

    var del=el("button","mini","Delete submission"); del.type="button";
    del.style.marginLeft="auto";
    del.addEventListener("click",function(){
      armDelete(del,function(){
        deleteSubmission(row,function(){ state.admin.open=null; render(); window.scrollTo(0,0); });
      });
    });
    acts.appendChild(del);

    p.appendChild(acts);

    /* ---- details the reviewer can correct, plus the CSV's specialEventId ---- */
    var d0={eventDate:row.eventDate||"",location:row.location||"",specialEventId:row.specialEventId||""};
    if(!state.admin.editDraft) state.admin.editDraft=Object.assign({},d0);
    var draft=state.admin.editDraft;

    var edit=el("div","eventrow");
    var grid=el("div","editgrid");

    function fieldWrap(labelText,id,node){
      var w=el("div","tool grow");
      var l=el("label","toollabel",labelText);
      l.setAttribute("for",id);
      w.appendChild(l); w.appendChild(node);
      return w;
    }

    var dateInp=document.createElement("input");
    dateInp.type="date"; dateInp.id="edit-date"; dateInp.value=draft.eventDate;
    dateInp.addEventListener("input",function(){ draft.eventDate=dateInp.value; refreshSave(); });
    grid.appendChild(fieldWrap("Date of event","edit-date",dateInp));

    var storeSel=document.createElement("select");
    storeSel.id="edit-store";
    var blank=document.createElement("option");
    blank.value=""; blank.textContent="No store";
    storeSel.appendChild(blank);
    var opts=STORES.slice();
    if(draft.location && opts.indexOf(draft.location)<0) opts.push(draft.location);
    opts.forEach(function(s){
      var o=document.createElement("option"); o.value=s; o.textContent=s; storeSel.appendChild(o);
    });
    storeSel.value=draft.location;
    storeSel.addEventListener("change",function(){ draft.location=storeSel.value; refreshSave(); });
    grid.appendChild(fieldWrap("Store","edit-store",storeSel));

    var evInp=document.createElement("input");
    evInp.type="text"; evInp.id="edit-event";
    evInp.placeholder="Leave blank if this isn't a special event";
    evInp.value=draft.specialEventId;
    evInp.addEventListener("input",function(){ draft.specialEventId=evInp.value; refreshSave(); });
    evInp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); saveDetails(); } });
    grid.appendChild(fieldWrap("Special Event ID","edit-event",evInp));

    edit.appendChild(grid);

    var saveRow=el("div","acts");
    var saveBtn=el("button","mini primary","Save changes"); saveBtn.type="button";
    var undoBtn=el("button","mini","Undo"); undoBtn.type="button";
    function dirty(){
      return draft.eventDate!==d0.eventDate ||
             draft.location!==d0.location ||
             draft.specialEventId.trim()!==d0.specialEventId.trim();
    }
    function refreshSave(){
      saveBtn.disabled=!dirty();
      undoBtn.hidden=!dirty();
    }
    function saveDetails(){
      if(!dirty()) return;
      saveBtn.disabled=true;
      api("PATCH","/api/review/submissions/"+row.id,{
        eventDate:draft.eventDate,
        location:draft.location,
        specialEventId:draft.specialEventId.trim()
      }).then(function(){
        row.eventDate=draft.eventDate;
        row.location=draft.location;
        row.specialEventId=draft.specialEventId.trim();
        state.admin.editDraft=null;
        toast("Details saved");
        render();
      }).catch(function(e){
        saveBtn.disabled=false;
        toast(e.status===403 ? "You have read-only access to this app"
                             : "Couldn't save ("+(e.message||"error")+")");
      });
    }
    saveBtn.addEventListener("click",saveDetails);
    undoBtn.addEventListener("click",function(){ state.admin.editDraft=null; render(); });
    saveRow.appendChild(saveBtn); saveRow.appendChild(undoBtn);
    edit.appendChild(saveRow);

    edit.appendChild(el("p","hint",
      row.specialEventId
        ? "Every CSV you download for this submission carries “"+row.specialEventId+"” in the specialEventId column."
        : "The Special Event ID fills the specialEventId column on every CSV downloaded for this submission."));
    refreshSave();
    p.appendChild(edit);

    frag.appendChild(p);

    /* ---- spelling & grammar, producer side ---- */
    var rp=el("section","panel");
    var rbar=el("div","copybar"); rbar.style.marginTop="0";
    rbar.appendChild(el("h3","","Spelling & grammar"));
    if(state.admin.reviewState!=="running"){
      var runBtn=el("button","mini primary",
        state.admin.reviewState==="idle" ? "Check this submission" : "Check again");
      runBtn.type="button";
      runBtn.addEventListener("click",function(){ runAdminReview(row); });
      rbar.appendChild(runBtn);
    }
    rp.appendChild(rbar);

    if(state.admin.reviewState==="idle"){
      rp.appendChild(el("p","hint","Claude reads every question and answer in this submission and suggests fixes. Accepting one writes it back to the submission, so the copy buttons below stay in sync. Submitters never see this."));
    } else if(state.admin.reviewState==="running"){
      rp.appendChild(el("p","empty","Reading the submission… usually under a minute."));
    } else {
      if(state.admin.reviewMsg) rp.appendChild(el("div","notice",state.admin.reviewMsg));
      state.admin.checks.forEach(function(c){
        var box=el("div","check");
        box.appendChild(el("div","where",c.where));
        var d=el("div","diff");
        d.appendChild(el("span","was",c.was));
        d.appendChild(document.createTextNode("  →  "));
        d.appendChild(el("span","now",c.now));
        box.appendChild(d);
        box.appendChild(el("p","why",c.why));
        var ba=el("div","acts");
        var acc=el("button","mini primary","Use the fix"); acc.type="button";
        acc.addEventListener("click",function(){ applyAdminFix(row,c); });
        var ig=el("button","mini","Keep as written"); ig.type="button";
        ig.addEventListener("click",function(){
          state.admin.checks=state.admin.checks.filter(function(x){ return x.id!==c.id; }); render();
        });
        ba.appendChild(acc); ba.appendChild(ig);
        box.appendChild(ba);
        rp.appendChild(box);
      });
    }
    frag.appendChild(rp);

    /* ---- one panel per game: copyable fields + TSV ---- */
    (row.games||[]).forEach(function(gid){
      var g=gameById(gid); if(!g) return;
      var rows=(row.content||{})[gid]||[];
      var sec=el("section","panel");

      var bar=el("div","copybar"); bar.style.marginTop="0";
      bar.appendChild(el("h3","",g.name));
      if(g.exports && g.exports.length){
        var dls=el("div","acts");
        g.exports.forEach(function(spec){
          var a=document.createElement("a");
          a.className="mini primary";
          a.textContent = g.exports.length>1 ? "Download "+spec.label+" CSV" : "Download CSV";
          a.href=csvUrl(row,g.id,spec.slug);
          a.setAttribute("download","");
          dls.appendChild(a);
        });
        bar.appendChild(dls);
      }
      sec.appendChild(bar);
      sec.appendChild(el("p","hint","Click any value to copy just that field."));

      sec.appendChild(gameBody(g,rows,true));
      frag.appendChild(sec);
    });

    return frag;
  }


  /* =======================================================================
     Action bar
     ======================================================================= */
  function renderChrome(){
    renderRail();
    var bar=document.getElementById("actionbarInner");
    clear(bar);
    var abar=document.getElementById("actionbar");

    if(state.mode==="admin"){ abar.hidden=true; return; }
    abar.hidden=false;

    var status=el("div","statusline");
    var right=el("div"); right.style.display="flex"; right.style.gap="10px"; right.style.flexWrap="wrap";

    if(state.step===0){
      status.appendChild(document.createTextNode(contactValid()?"Ready to pick games.":"Name, email, event date and store are required."));
      var n0=el("button","btn","Choose games"); n0.type="button"; n0.disabled=!contactValid();
      n0.addEventListener("click",function(){ state.step=1; saveDraft(); render(); window.scrollTo(0,0); });
      right.appendChild(n0);
    }
    else if(state.step===1){
      var total=state.picked.reduce(function(a,gid){ return a+gameById(gid).count; },0);
      status.appendChild(document.createTextNode(
        state.picked.length ? state.picked.length+" game"+(state.picked.length>1?"s":"")+" · "+total+" questions to write"
                            : "Pick at least one game."));
      var b0=el("button","btn secondary","Back"); b0.type="button";
      b0.addEventListener("click",function(){ state.step=0; render(); window.scrollTo(0,0); });
      var n1=el("button","btn","Submit Questions"); n1.type="button"; n1.disabled=!state.picked.length;
      n1.addEventListener("click",function(){ state.step=2; saveDraft(); render(); window.scrollTo(0,0); });
      right.appendChild(b0); right.appendChild(n1);
    }
    else if(state.step===2){
      var done=0,tot=0;
      state.picked.forEach(function(gid){ var pr=gameProgress(gameById(gid)); done+=pr.done; tot+=pr.total; });
      var over=countOverLimit();
      var s=el("strong",null,done+" of "+tot+" questions complete");
      status.appendChild(s);
      if(over){
        status.appendChild(document.createTextNode(" · "));
        status.appendChild(el("span","bad",over+" field"+(over>1?"s":"")+" over the limit"));
      }
      var b1=el("button","btn secondary","Back"); b1.type="button";
      b1.addEventListener("click",function(){ state.step=1; render(); window.scrollTo(0,0); });
      var n2=el("button","btn","Review"); n2.type="button"; n2.disabled=!contentComplete();
      n2.addEventListener("click",function(){ state.step=3; saveDraft(); render(); window.scrollTo(0,0); });
      right.appendChild(b1); right.appendChild(n2);
    }
    else if(state.step===3){
      status.appendChild(document.createTextNode("Everything's filled in. Send it when you're happy with it."));
      var b2=el("button","btn secondary","Back to content"); b2.type="button";
      b2.addEventListener("click",function(){ state.step=2; render(); window.scrollTo(0,0); });
      var sub=el("button","btn",state.submitting?"Sending…":"Submit content"); sub.type="button";
      sub.disabled=state.submitting||!contentComplete();
      sub.addEventListener("click",submit);
      right.appendChild(b2); right.appendChild(sub);
    }
    else {
      abar.hidden=true; return;
    }
    bar.appendChild(status); bar.appendChild(right);
  }

  /* =======================================================================
     Router
     ======================================================================= */
  function render(){
    var view=document.getElementById("view");
    clear(view);
    var sub=document.getElementById("subhead");
    var modeBtn=document.getElementById("modeBtn");

    if(state.mode==="admin"){
      sub.textContent="Everything submitters have sent, ready to load into Chippy.";
      modeBtn.textContent="View the form";
      modeBtn.href="/";
      view.appendChild(adminView());
    } else {
      sub.textContent="Write your own trivia for the games your group will play in the studio. Everything you type here goes straight to our production team for review!";
      modeBtn.textContent="Producer view";
      modeBtn.href="/review";
      if(state.step===0) view.appendChild(stepContact());
      else if(state.step===1) view.appendChild(stepGames());
      else if(state.step===2) view.appendChild(stepContent());
      else if(state.step===3) view.appendChild(stepReview());
      else view.appendChild(stepReview());
    }
    renderChrome();
  }

  // Show the wordmark image once it loads; keep the text until then.
  (function(){
    var lg=document.getElementById("brandLogo"), txt=document.getElementById("brandFallback");
    if(!lg) return;
    function show(){ lg.hidden=false; if(txt) txt.hidden=true; }
    if(lg.complete && lg.naturalWidth) show();          // already cached
    lg.addEventListener("load",show);
    lg.addEventListener("error",function(){ lg.remove(); });
  })();

  state.mode = (APP.mode === "review") ? "admin" : "form";
  if(state.mode==="form") loadDraft();
  render();
  if(state.mode==="admin"){ loadSubmissions(); loadStoreRows(); }
  else loadStores();
})();
</script>
</body>
</html>
